name: CI/CD Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop ]

jobs:
  # Job per testet e backend
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: logitrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install backend dependencies
        run: cd backend && npm ci
      
      - name: Run backend unit tests
        run: cd backend && npm test
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: logitrack_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key-for-ci-only
          SUPER_ADMIN_SECRET_KEY: test-super-secret-key-for-ci
          JWT_EXPIRES_IN: 7d
      
      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
      
      - name: Build backend
        run: cd backend && npm run build

  # Job per testet e frontend
  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      
      - name: Run frontend tests
        run: cd frontend && npm test -- --run
      
      - name: Build frontend
        run: cd frontend && npm run build
        env:
          VITE_API_URL: ${{ secrets.STAGING_API_URL }}
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

  # Job per linting
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install backend dependencies
        run: cd backend && npm ci
      
      - name: Run ESLint
        run: cd backend && npm run lint || true
      
      - name: Check formatting
        run: cd backend && npx prettier --check "src/**/*.ts" || true

  # Job per integrimin e te gjitha testeve (SKIP AI)
  integration-tests:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, lint]
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: logitrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install backend dependencies
        run: cd backend && npm ci
      
      - name: Create mock for transformers
        run: |
          cd backend
          mkdir -p test/mocks
          echo "module.exports = { pipeline: jest.fn(), env: {} };" > test/mocks/transformers.js
      
      - name: Run database migrations
        run: cd backend && npm run migration:run || true
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: logitrack_test
          DB_USER: postgres
          DB_PASSWORD: postgres
      
      - name: Run API tests (SKIP AI MODULES)
        run: |
          cd backend
          npm run test:e2e -- \
            --testPathIgnorePatterns="ai|transformers" \
            --moduleNameMapper='^@xenova/transformers$=<rootDir>/test/mocks/transformers.js' \
            --passWithNoTests \
            || true
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: logitrack_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: test-secret-key-for-ci-only
          SUPER_ADMIN_SECRET_KEY: test-super-secret-key-for-ci

  # Job per deploy ne staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [integration-tests]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Deploy backend to staging
        run: |
          echo "Deploying backend to staging..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.STAGING_SERVER_USER }}@${{ secrets.STAGING_SERVER_IP }} << 'EOF'
            cd /var/www/logitrack/backend
            git pull origin develop
            npm ci
            npm run build
            npx prisma migrate deploy
            pm2 restart logitrack-backend
          EOF
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
      
      - name: Deploy frontend to staging
        run: |
          echo "Deploying frontend to staging..."
          cd frontend
          npm ci
          npm run build
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" dist/ ${{ secrets.STAGING_SERVER_USER }}@${{ secrets.STAGING_SERVER_IP }}:/var/www/logitrack/frontend/dist/
        env:
          VITE_API_URL: ${{ secrets.STAGING_API_URL }}

  # Job per deploy ne production
  deploy-production:
    runs-on: ubuntu-latest
    needs: [integration-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Deploy backend to production
        run: |
          echo "Deploying backend to production..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_IP }} << 'EOF'
            cd /var/www/logitrack/backend
            git pull origin main
            npm ci
            npm run build
            npx prisma migrate deploy
            pm2 restart logitrack-backend
          EOF
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
      
      - name: Deploy frontend to production
        run: |
          echo "Deploying frontend to production..."
          cd frontend
          npm ci
          npm run build
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" dist/ ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_IP }}:/var/www/logitrack/frontend/dist/
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL }}
      
      - name: Send notification on success
        if: success()
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d '{"text": "✅ Deployment to production completed successfully!"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }} || true

  # Job per te gjeneruar dhe ruajtur coverage
  coverage:
    runs-on: ubuntu-latest
    needs: [test-backend]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: coverage
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: backend-coverage
          fail_ci_if_error: false