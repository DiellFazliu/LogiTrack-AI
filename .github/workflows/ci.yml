name: CI/CD Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop ]

jobs:
  # Job për testet e backend
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: logitrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install backend dependencies
        run: cd backend && npm ci
      
      - name: Run backend unit tests
        run: cd backend && npm test
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: logitrack_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key-for-ci-only
          SUPER_ADMIN_SECRET_KEY: test-super-secret-key-for-ci
          JWT_EXPIRES_IN: 7d
      
      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
      
      - name: Build backend
        run: cd backend && npm run build

  # Job për testet e frontend
  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      
      - name: Run frontend tests
        run: cd frontend && npm test -- --run
      
      - name: Build frontend
        run: cd frontend && npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

  # Job për linting
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install backend dependencies
        run: cd backend && npm ci
      
      - name: Run ESLint
        run: cd backend && npm run lint || true
      
      - name: Check formatting
        run: cd backend && npx prettier --check "src/**/*.ts" || true

  # Job për integrimin e të gjitha testeve (SKIP AI)
  integration-tests:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, lint]
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: logitrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install backend dependencies
        run: cd backend && npm ci
      
      - name: Create mock for transformers
        run: |
          cd backend
          mkdir -p test/mocks
          echo "module.exports = { pipeline: jest.fn(), env: {} };" > test/mocks/transformers.js
      
      - name: Run database migrations
        run: cd backend && npm run migration:run || true
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: logitrack_test
          DB_USER: postgres
          DB_PASSWORD: postgres
      
      - name: Run API tests (SKIP AI MODULES)
        run: |
          cd backend
          npm run test:e2e -- \
            --testPathIgnorePatterns="ai|transformers" \
            --moduleNameMapper='^@xenova/transformers$=<rootDir>/test/mocks/transformers.js' \
            --passWithNoTests \
            || true
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: logitrack_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: test-secret-key-for-ci-only
          SUPER_ADMIN_SECRET_KEY: test-super-secret-key-for-ci